server:
  port: 8080
spring:
  application:
    name: "ticketing"
  profiles:
    default: "local"
aws:
  region: "${AWS_REGION:us-east-1}"
  dynamodb:
    tables:
      events: "${TABLE_EVENTS:ticketing-events}"
      tickets: "${TABLE_TICKETS:ticketing-tickets}"
      orders: "${TABLE_ORDERS:ticketing-orders}"
  sqs:
    orders-queue-url: "${ORDERS_QUEUE_URL}"
adapter:
  sqs:
    region: "${aws.region}"
    queueUrl: "${aws.sqs.orders-queue-url}"
entrypoint:
  sqs:
    queueUrl: "${aws.sqs.orders-queue-url}"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 30
    concurrentPollers: 2
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}"
ticketing:
  reservation-ttl: "${RESERVATION_TTL:10m}"
  expiration-sweep-interval: "${EXPIRATION_SWEEP_INTERVAL:30s}"
